[workspace]
members = [
    "apps/web",
    "crates/nanogpt-model",
    "crates/nanogpt-schema",
    "crates/nanogpt-tokenizer",
    "crates/nanogpt-trace",
]
resolver = "3"

[workspace.package]
categories = ["visualization", "wasm"]
edition = "2024"
keywords = ["education", "transformer", "visualization", "wasm"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/code0-god/transformer_viz"
rust-version = "1.94.0"
version = "0.1.0"

[workspace.dependencies]
nanogpt-model = { path = "crates/nanogpt-model" }
nanogpt-schema = { path = "crates/nanogpt-schema" }
nanogpt-tokenizer = { path = "crates/nanogpt-tokenizer" }
nanogpt-trace = { path = "crates/nanogpt-trace" }
thiserror = "=2.0.16"

[workspace.lints.rust]
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
non_ascii_idents = "deny"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
