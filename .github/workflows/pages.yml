name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository and nanoGPT reference
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.22.0
      - name: Install frozen JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Rust and WASM tools
        run: |
          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.94.0
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Run release checks
        run: ./scripts/check.sh
      - name: Build subpath release
        run: ./scripts/build-web.sh /transformer_viz/ apps/web/dist
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
