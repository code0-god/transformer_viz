name: transformer-viz

services:
  web:
    build:
      context: .
    environment:
      CHROME: /usr/local/bin/chromium-docker
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error --max-time 2 http://127.0.0.1:5173/ >/dev/null
      interval: 1s
      timeout: 3s
      start_period: 10m
      retries: 3
    init: true
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      - cargo-target:/workspace/target

volumes:
  node-modules:
  web-node-modules:
  cargo-target:
