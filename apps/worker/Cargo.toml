[package]
name = "transformer-viz-worker"
description = "Rust/WASM inference Worker for transformer-viz"
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
nanogpt-model.workspace = true
nanogpt-schema.workspace = true
nanogpt-tokenizer.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror.workspace = true

[target.wasm32-unknown-unknown.dependencies]
console_error_panic_hook = "=0.1.7"
gloo-net = { version = "=0.6.0", features = ["http"] }
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
js-sys = "=0.3.104"
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"

[target.wasm32-unknown-unknown.dependencies.web-sys]
version = "=0.3.104"
features = [
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "Performance",
    "RequestRedirect",
    "Url",
    "WorkerLocation",
    "console",
]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[lints]
workspace = true
