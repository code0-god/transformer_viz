<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <base data-trunk-public-url />
    <title>Transformer Viz - 브라우저 nanoGPT 탐색기</title>
    <meta name="description" content="Rust Web Worker가 생성한 실제 nanoGPT trace를 토큰, 어텐션, 텐서 단위로 탐색합니다." />
    <meta name="theme-color" content="#f3f0e8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2322221f'/%3E%3Cpath d='M8 10h16M8 16h16M8 22h16' stroke='%23f3f0e8' stroke-width='3'/%3E%3C/svg%3E" />
    <link data-trunk rel="css" href="style.css" />
  </head>
  <body>
    <div id="startup-shell" class="startup-shell">
      <header class="startup-shell__header">
        <div class="brand-lockup">
          <h1>Transformer Viz</h1>
          <p>실제 trace로 따라가는 Guided Learning Player</p>
        </div>
        <span class="status-badge" data-status="loading">브라우저 앱 불러오는 중</span>
      </header>
      <main class="startup-shell__main">
        <section class="startup-shell__surface" aria-labelledby="startup-title">
          <span class="stage-position">STARTUP / LOCAL INFERENCE</span>
          <h2 id="startup-title">실제 nanoGPT trace를 준비하고 있습니다</h2>
          <p>Rust 앱이 준비되면 전용 Worker가 같은 출처의 학습용 모델을 검증해 불러옵니다.</p>
          <dl class="startup-shell__ledger">
            <div><dt>브라우저 앱</dt><dd>불러오는 중</dd></div>
            <div><dt>모델 Worker</dt><dd>앱 시작 후 준비</dd></div>
          </dl>
        </section>
        <aside class="startup-shell__path" aria-label="시작 경로">
          <strong>시작 경로</strong>
          <ol>
            <li>브라우저 앱</li>
            <li>전용 Worker</li>
            <li>학습용 모델</li>
          </ol>
        </aside>
      </main>
    </div>
    <!-- GUIDED_PLAYER_DIRECTION
    THESIS: One current learning stage dominates; the equal-panel instrumentation dashboard is refused.

    FIRST VIEWPORT: Compact lifecycle and prompt rows lead to a sticky token context; the wide Main Stage sits between a narrow Model Map and scrolling Inspector, with the Stage Rail closing the viewport.

    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md

    <link data-trunk rel="copy-dir" href="public/reference" />
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="app" data-type="main" data-wasm-opt="z" />
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="worker" data-type="worker" data-loader-shim data-bindgen-target="web" data-wasm-opt="z" />
  </body>
