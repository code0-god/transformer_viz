[package]
name = "transformer-viz-web"
description = "Leptos browser application for transformer-viz"
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
console_error_panic_hook = "=0.1.7"
js-sys = "=0.3.104"
leptos = { version = "=0.8.20", features = ["csr"] }
nanogpt-model.workspace = true
nanogpt-schema.workspace = true
nanogpt-tokenizer.workspace = true
nanogpt-trace.workspace = true
serde = { version = "=1.0.228", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
thiserror.workspace = true
wasm-bindgen = "=0.2.127"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }

[dependencies.web-sys]
version = "=0.3.104"
features = [
    "DedicatedWorkerGlobalScope",
    "ErrorEvent",
    "MessageEvent",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "console",
]

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true
