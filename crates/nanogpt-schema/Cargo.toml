[package]
name = "nanogpt-schema"
description = "Shared boundary types for transformer-viz"
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
typescript-bindings = ["dep:ts-rs"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
thiserror.workspace = true
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"], optional = true }

[dev-dependencies]
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[[bin]]
name = "export-typescript-bindings"
path = "src/bin/export_typescript_bindings.rs"
required-features = ["typescript-bindings"]

[lints]
workspace = true
